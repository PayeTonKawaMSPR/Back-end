version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password

  api-produit:
    build: ./api-produit  # Pointe vers le dossier api-produit
    ports:
      - "5000:5000"  # Même port que ton Express
    environment:
      - RABBITMQ_URL=amqp://admin:password@rabbitmq
    depends_on:
      - rabbitmq
    # env_file:
    #   - ./api-produit/.env