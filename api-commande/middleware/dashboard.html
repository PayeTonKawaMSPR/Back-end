<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard API-COMMANDE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .stat-card h3 {
            color: #5a67d8;
            margin-bottom: 15px;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #718096;
            font-size: 0.9em;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-connected {
            background-color: #48bb78;
            box-shadow: 0 0 10px rgba(72, 187, 120, 0.4);
        }

        .status-disconnected {
            background-color: #f56565;
            box-shadow: 0 0 10px rgba(245, 101, 101, 0.4);
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .chart-card h3 {
            color: #5a67d8;
            margin-bottom: 20px;
            font-size: 1.2em;
            flex-shrink: 0;
        }

        .chart-container {
            height: 300px;
        }

        .refresh-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .refresh-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .last-update {
            text-align: center;
            color: white;
            opacity: 0.8;
            margin-top: 20px;
        }

        .order-status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .order-status-item {
            background: rgba(90, 103, 216, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid rgba(90, 103, 216, 0.2);
        }

        .order-status-item .status-name {
            font-weight: bold;
            color: #5a67d8;
            margin-bottom: 5px;
        }

        .order-status-item .status-count {
            font-size: 1.5em;
            font-weight: bold;
            color: #2d3748;
        }

        .pending { border-color: #ed8936; background-color: rgba(237, 137, 54, 0.1); }
        .shipped { border-color: #3182ce; background-color: rgba(49, 130, 206, 0.1); }
        .delivered { border-color: #38a169; background-color: rgba(56, 161, 105, 0.1); }
        .cancelled { border-color: #e53e3e; background-color: rgba(229, 62, 62, 0.1); }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .stat-card.updating {
            animation: pulse 1s ease-in-out;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> Dashboard API-COMMANDE</h1>
            <p>Métriques et monitoring en temps réel</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3> Total Commandes</h3>
                <div class="stat-value" id="totalOrders">-</div>
                <div class="stat-label">Commandes en base</div>
            </div>

            <div class="stat-card">
                <h3> Requêtes HTTP</h3>
                <div class="stat-value" id="httpRequests">-</div>
                <div class="stat-label">Requêtes totales</div>
            </div>

            <div class="stat-card">
                <h3> Base de données</h3>
                <div class="stat-value">
                    <span class="status-indicator" id="dbStatus"></span>
                    <span id="dbStatusText">-</span>
                </div>
                <div class="stat-label">Statut MongoDB</div>
            </div>

            <div class="stat-card">
                <h3> RabbitMQ</h3>
                <div class="stat-value">
                    <span class="status-indicator" id="rabbitmqStatus"></span>
                    <span id="rabbitmqStatusText">-</span>
                </div>
                <div class="stat-label">Statut RabbitMQ</div>
            </div>
        </div>

        <div class="charts-container">
    <div class="chart-card">
        <h3> Commandes par Statut</h3>
        <div class="chart-container" style="height: 250px;">
            <canvas id="orderStatusChart"></canvas>
        </div>
    </div>

    <div class="chart-card">
        <h3> Temps de Réponse</h3>
        <div class="chart-container" style="height: 250px;">
            <canvas id="responseTimeChart"></canvas>
        </div>
    </div>
</div>

        <div class="stat-card">
            <h3> Détail des Commandes par Statut</h3>
            <div class="order-status-grid" id="orderStatusGrid">
                <!-- Sera rempli dynamiquement -->
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="refresh-button" onclick="refreshData()">🔄 Actualiser</button>
        </div>

        <div class="last-update">
            Dernière mise à jour: <span id="lastUpdate">-</span>
        </div>
    </div>

    <script>
        let orderStatusChart;
        let responseTimeChart;

        // Initialiser les graphiques
        function initCharts() {
    // Graphique des commandes par statut
    const ctx1 = document.getElementById('orderStatusChart').getContext('2d');
    orderStatusChart = new Chart(ctx1, {
        type: 'doughnut',
        data: {
            labels: ['En attente', 'Expédiées', 'Livrées', 'Annulées'],
            datasets: [{
                data: [0, 0, 0, 0],
                backgroundColor: ['#ed8936', '#3182ce', '#38a169', '#e53e3e'],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false, // Ajouté
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });

    // Graphique des temps de réponse
    const ctx2 = document.getElementById('responseTimeChart').getContext('2d');
    responseTimeChart = new Chart(ctx2, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Temps de réponse (ms)',
                data: [],
                borderColor: '#667eea',
                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false, // Ajouté
            scales: {
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Temps (ms)'
                    },
                    suggestedMax: 500 // Limite l'échelle verticale
                }
            }
        }
    });
}

        // Récupérer les métriques
        async function fetchMetrics() {
            try {
                const response = await fetch('/metrics');
                const metricsText = await response.text();
                return parseMetrics(metricsText);
            } catch (error) {
                console.error('Erreur lors de la récupération des métriques:', error);
                return {};
            }
        }

        // Parser les métriques Prometheus
        function parseMetrics(metricsText) {
            const metrics = {};
            const lines = metricsText.split('\n');
            
            lines.forEach(line => {
                if (line.startsWith('commande_')) {
                    const parts = line.split(' ');
                    if (parts.length >= 2) {
                        const key = parts[0];
                        const value = parseFloat(parts[1]);
                        
                        if (!isNaN(value)) {
                            metrics[key] = value;
                        }
                    }
                }
            });
            
            return metrics;
        }

        // Mettre à jour l'affichage
        async function updateDisplay() {
            const metrics = await fetchMetrics();
            
            // Animer les cartes
            document.querySelectorAll('.stat-card').forEach(card => {
                card.classList.add('updating');
                setTimeout(() => card.classList.remove('updating'), 1000);
            });
            
            // Total des commandes
            const totalOrders = metrics['commande_database_orders_total'] || 0;
            document.getElementById('totalOrders').textContent = totalOrders;
            
            // Requêtes HTTP
            const httpRequests = Object.keys(metrics)
                .filter(key => key.startsWith('commande_http_requests_total'))
                .reduce((sum, key) => sum + metrics[key], 0);
            document.getElementById('httpRequests').textContent = httpRequests;
            
            // Statut DB
            const dbStatus = metrics['commande_database_status'] === 1;
            const dbStatusEl = document.getElementById('dbStatus');
            const dbStatusTextEl = document.getElementById('dbStatusText');
            
            if (dbStatus) {
                dbStatusEl.className = 'status-indicator status-connected';
                dbStatusTextEl.textContent = 'Connecté';
            } else {
                dbStatusEl.className = 'status-indicator status-disconnected';
                dbStatusTextEl.textContent = 'Déconnecté';
            }
            
            // Statut RabbitMQ
            const rabbitmqStatus = metrics['commande_rabbitmq_status'] === 1;
            const rabbitmqStatusEl = document.getElementById('rabbitmqStatus');
            const rabbitmqStatusTextEl = document.getElementById('rabbitmqStatusText');
            
            if (rabbitmqStatus) {
                rabbitmqStatusEl.className = 'status-indicator status-connected';
                rabbitmqStatusTextEl.textContent = 'Connecté';
            } else {
                rabbitmqStatusEl.className = 'status-indicator status-disconnected';
                rabbitmqStatusTextEl.textContent = 'Déconnecté';
            }
            
            // Commandes par statut
            const statusData = {
                pending: 0,
                shipped: 0,
                delivered: 0,
                cancelled: 0
            };
            
            Object.keys(metrics).forEach(key => {
                if (key.startsWith('commande_orders_by_status{status="')) {
                    const statusMatch = key.match(/status="([^"]+)"/);
                    if (statusMatch) {
                        const status = statusMatch[1];
                        statusData[status] = metrics[key] || 0;
                    }
                }
            });
            
            // Mettre à jour le graphique
            orderStatusChart.data.datasets[0].data = [
                statusData.pending,
                statusData.shipped,
                statusData.delivered,
                statusData.cancelled
            ];
            orderStatusChart.update();
            
            // Mettre à jour la grille des statuts
            const statusGrid = document.getElementById('orderStatusGrid');
            statusGrid.innerHTML = `
                <div class="order-status-item pending">
                    <div class="status-name">En attente</div>
                    <div class="status-count">${statusData.pending}</div>
                </div>
                <div class="order-status-item shipped">
                    <div class="status-name">Expédiées</div>
                    <div class="status-count">${statusData.shipped}</div>
                </div>
                <div class="order-status-item delivered">
                    <div class="status-name">Livrées</div>
                    <div class="status-count">${statusData.delivered}</div>
                </div>
                <div class="order-status-item cancelled">
                    <div class="status-name">Annulées</div>
                    <div class="status-count">${statusData.cancelled}</div>
                </div>
            `;
            
            // Mettre à jour l'heure
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        }

        // Actualiser les données
        function refreshData() {
            updateDisplay();
        }

        // Initialiser au chargement
        window.onload = function() {
            initCharts();
            updateDisplay();
            // Actualiser toutes les 30 secondes
            setInterval(updateDisplay, 30000);
        };
    </script>
</body>
</html>
